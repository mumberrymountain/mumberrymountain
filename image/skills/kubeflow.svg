<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 94" width="88" height="94" role="img" aria-label="Kubeflow">
  <style>
    text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; font-size: 12px; fill: #8b949e; }
    .t { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; animation-delay: 0.21s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    @media (prefers-reduced-motion: reduce) { .t { animation: none; } }
  </style>
  <g class="t">
    <rect x="14.5" y="0.5" width="59" height="59" rx="14" fill="#161b22" stroke="#30363d"/>
    <image href="data:image/svg+xml;base64," x="28.0" y="14" width="32" height="32"/>
    <text x="44.0" y="82" text-anchor="middle">Kubeflow</text>
  </g>
</svg>
