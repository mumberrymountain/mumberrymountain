<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 372 124" width="372" height="124" role="img" aria-label="opentofu/opentofu #4077 (bugfix) — tofu init -backend=false 실행 시 암호화된 로컬state 파일을 불필요하게 복호화하던 문제 수정">
