<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" role="img" aria-label="Jeon Insoo — DevOps/SRE Engineer. Building reliable infrastructure &amp; automating everything, with contributions to the CNCF ecosystem.">
